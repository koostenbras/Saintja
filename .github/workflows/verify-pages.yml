name: Verify Pages URL

on:
  workflow_dispatch:
  push:
    branches: [claude/saint-alle-activity-app-fz4ws5]

permissions:
  contents: read
  pages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Pages builds via GitHub Actions (not legacy branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== CURRENT PAGES CONFIG ==="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages | tee /tmp/pages.json
          BT=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type'))")
          if [ "$BT" = "legacy" ]; then
            echo "=== Switching build_type legacy -> workflow ==="
            curl -sS -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"build_type":"workflow"}' -w "\nHTTP %{http_code}\n"
          else
            echo "build_type already: $BT"
          fi

      - name: Probe the live github.io URL (cache-busted)
        run: |
          URL="https://koostenbras.github.io/Saintja/?nocache=${{ github.run_id }}"
          echo "=== HEADERS for $URL ==="
          curl -sS -o /tmp/page.html -D - -L --max-time 30 \
            -H "Cache-Control: no-cache" "$URL" || true
          echo "=== FIRST 40 LINES OF BODY ==="
          head -40 /tmp/page.html || true
          echo "=== DIAGNOSIS ==="
          if grep -q "/src/main.jsx" /tmp/page.html; then
            echo "RAW SOURCE is being served (broken)"; exit 1
          elif grep -q "assets/index-" /tmp/page.html; then
            echo "BUILT APP is being served (working)"
          else
            echo "UNEXPECTED CONTENT"; exit 1
          fi
