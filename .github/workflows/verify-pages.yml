name: Verify Pages URL

on:
  workflow_dispatch:
  push:
    branches: [claude/saint-alle-activity-app-fz4ws5]

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Show current Pages config (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== CURRENT PAGES CONFIG for ${{ github.repository }} ==="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages

      - name: Probe the live github.io URL
        run: |
          URL="https://koostenbras.github.io/Saintja/"
          echo "=== HEADERS for $URL ==="
          curl -sS -o /tmp/page.html -D - -L --max-time 30 "$URL" || true
          echo "=== FIRST 40 LINES OF BODY ==="
          head -40 /tmp/page.html || true
          echo "=== DIAGNOSIS ==="
          if grep -q "/src/main.jsx" /tmp/page.html; then
            echo "RAW SOURCE is being served (broken)"; exit 1
          elif grep -q "assets/index-" /tmp/page.html; then
            echo "BUILT APP is being served (working)"
          else
            echo "UNEXPECTED CONTENT"; exit 1
          fi
