name: Fetch Visorando route lists
on:
  push:
    branches: [claude/saint-alle-activity-app-fz4ws5]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch commune pages and extract routes
        run: python3 scripts/scrape_visorando.py
      - name: Commit the list
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scratch/
          git commit -m "scratch: Visorando route lists" || echo "nothing to commit"
          git push || true
